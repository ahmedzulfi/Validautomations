[package]
name = "glowkit-example-agent-rig"
description = "A rig agent with a tool, streamed into a native UI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
glowkit = { workspace = true, features = ["ai"] }
glowkit-stream = { workspace = true, features = ["egui", "rig"] }
eframe = { workspace = true, features = ["default"] }
rig-core = { workspace = true, features = ["reqwest", "rustls"] }
rig-agent.workspace = true
futures-util.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
