[package]
name = "glowkit-example-agent-ollama"
description = "Local LLM chat against Ollama or any OpenAI-compatible server, with streamed reasoning."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
glowkit = { workspace = true, features = ["ai"] }
glowkit-stream = { workspace = true, features = ["egui", "async-openai"] }
eframe = { workspace = true, features = ["default"] }
async-openai = { workspace = true, features = ["chat-completion", "model", "byot", "rustls"] }
futures-util.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
