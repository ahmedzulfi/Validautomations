[package]
name = "glowkit-example-agent-ag-ui"
description = "A desktop front-end for any AG-UI agent, or an offline replay of a recorded run."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
glowkit = { workspace = true, features = ["ai"] }
glowkit-stream = { workspace = true, features = ["egui", "http"] }
eframe = { workspace = true, features = ["default"] }
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
