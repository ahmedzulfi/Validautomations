[workspace]
resolver = "2"
# ports/ holds separate workspaces for other UI frameworks (GPUI, Dioxus).
exclude = ["ports"]
members = [
    "crates/glowkit-core",
    "crates/glowkit-text",
    "crates/glowkit-backgrounds",
    "crates/glowkit-effects",
    "crates/glowkit-components",
    "crates/glowkit-charts",
    "crates/glowkit-ai",
    "crates/glowkit-blocks",
    "crates/glowkit-motion",
    "crates/glowkit-3d",
    "crates/glowkit-canvas",
    "crates/glowkit-templates",
    "crates/glowkit-interactions",
    "crates/glowkit-agents",
    "crates/glowkit-stream",
    "crates/glowkit",
    "apps/gallery",
    "examples/hello",
    "examples/ai-chat",
    "examples/agent-ollama",
    "examples/agent-rig",
    "examples/agent-ag-ui",
    "examples/agent-vercel",
    "crates/glowkit-mcp",
    "crates/glowkit-cli",
    "apps/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/glowkit-rs/glowkit"
homepage = "https://github.com/glowkit-rs/glowkit"
keywords = ["egui", "ui", "animation", "gui", "components"]
categories = ["gui", "graphics"]
authors = ["glowkit contributors"]

[workspace.dependencies]
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.37", default-features = false }
glowkit-core = { path = "crates/glowkit-core", version = "0.1.0" }
glowkit-text = { path = "crates/glowkit-text", version = "0.1.0" }
glowkit-backgrounds = { path = "crates/glowkit-backgrounds", version = "0.1.0" }
glowkit-effects = { path = "crates/glowkit-effects", version = "0.1.0" }
glowkit-components = { path = "crates/glowkit-components", version = "0.1.0" }
glowkit-charts = { path = "crates/glowkit-charts", version = "0.1.0" }
glowkit-ai = { path = "crates/glowkit-ai", version = "0.1.0" }
glowkit-blocks = { path = "crates/glowkit-blocks", version = "0.1.0" }
glowkit-motion = { path = "crates/glowkit-motion", version = "0.1.0" }
glowkit-3d = { path = "crates/glowkit-3d", version = "0.1.0" }
glowkit-canvas = { path = "crates/glowkit-canvas", version = "0.1.0" }
glowkit-templates = { path = "crates/glowkit-templates", version = "0.1.0" }
glowkit-interactions = { path = "crates/glowkit-interactions", version = "0.1.0" }
glowkit-agents = { path = "crates/glowkit-agents", version = "0.1.0" }
glowkit-stream = { path = "crates/glowkit-stream", version = "0.1.0" }
glowkit = { path = "crates/glowkit", version = "0.1.0", default-features = false }
# glowkit-stream: core and adapters
serde = { version = "1", features = ["derive"] }
serde_json = "1"
agent-client-protocol = { version = "5.3", default-features = false }
async-openai = { version = "0.43", default-features = false }
# rig 0.45+ needs rustc 1.97.1. The adapter is verified against 0.44 and 0.46; Cargo.lock pins 0.44
# so the workspace builds on rustc 1.97.0 (`cargo update -p rig-agent -p rig-core` moves to 0.46).
rig-core = { version = ">=0.44, <0.47", default-features = false }
rig-agent = { version = ">=0.44, <0.47", default-features = false }
reqwest = { version = "0.13", default-features = false }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
debug = false
incremental = false

[profile.dev.package."*"]
opt-level = 2

# Size-optimized profile for the WebAssembly gallery: `cargo build --profile web`.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
