<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>glowkit gallery</title>
  <meta name="description" content="Live gallery of every glowkit component, running as Rust compiled to WebAssembly." />
  <link rel="icon" href="../favicon.svg" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #09090b; }
    canvas#glowkit_canvas { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #a1a1aa;
      font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
    #loading .spinner { width: 28px; height: 28px; margin: 0 auto 12px; border-radius: 50%;
      border: 2px solid #27272a; border-top-color: #8b5cf6; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="glowkit_canvas"></canvas>
  <div id="loading"><div><div class="spinner"></div>Loading the gallery (Rust → WebAssembly)…</div></div>
  <script type="module">
    // ?pkg=<dir> loads an alternative build (used by per-crate dev builds)
    const pkg = new URLSearchParams(location.search).get("pkg") || "pkg";
    const { default: init } = await import(`./${pkg}/glowkit-gallery.js`);
    init().catch((e) => {
      if (!String(e).includes("Using exceptions for control flow")) {
        document.getElementById("loading").textContent = "Failed to load: " + e;
      }
    });
  </script>
</body>
</html>
