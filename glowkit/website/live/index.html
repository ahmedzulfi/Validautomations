<title>glowkit Gallery</title>
<style>
  /* Full-bleed canvas app: the Rust gallery draws everything; this page only hosts it. */
  :root {
    --bg: #ffffff;
    --fg: #111113;
    --muted: #71717a;
    --track: #e4e4e7;
    --accent: #111113;
    --font-ui: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); overflow: hidden; }
  #glowkit_canvas { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; display: block; }
  #loading {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    padding-inline: 16px; color: var(--muted); font-size: 14px; line-height: 1.5;
  }
  #loading strong { display: block; color: var(--fg); font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 4px; }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 14px; border-radius: 50%;
    border: 2px solid var(--track); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
</style>

<canvas id="glowkit_canvas"></canvas>
<div id="loading">
  <div>
    <div class="spinner"></div>
    <strong>glowkit gallery</strong>
    Loading 682 components, compiled from Rust to WebAssembly (about 13 MB)…
  </div>
</div>

<script type="module">
  const status = document.getElementById("loading");
  try {
    const { default: init } = await import("./pkg/glowkit-gallery.js");
    await init();
  } catch (e) {
    if (!String(e).includes("Using exceptions for control flow")) {
      status.innerHTML = "<div><strong>The gallery couldn't start</strong>" +
        "Your browser needs WebGL 2 and WebAssembly. Details: " + String(e).replace(/[<>&]/g, "") + "</div>";
    }
  }
</script>
