name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt, clippy, test, wasm (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev
      - run: cargo fmt --all -- --check
      # --all-features includes glowkit-stream's `rig` adapter, which needs a recent stable rustc
      # (see the MSRV job below for what the default features need).
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - name: Check the gallery for WebAssembly
        run: cargo check -p glowkit-gallery --target wasm32-unknown-unknown --locked

  msrv:
    name: MSRV (rustc 1.95, default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      # The library crates with their default features, plus every glowkit-stream adapter except
      # rig. Cargo.lock pins rig 0.44 (rustc 1.95); rig 0.45 and later need rustc 1.97.1.
      - run: cargo check --locked -p glowkit -p glowkit-cli -p glowkit-mcp
      - run: cargo check --locked -p glowkit-stream --features egui,ag-ui,vercel,acp,async-openai,http

  native:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the gallery, examples and tools
        run: cargo build --locked -p glowkit-gallery -p glowkit-example-hello -p glowkit-example-ai-chat -p glowkit-mcp -p glowkit-cli
      - name: Test the library crates
        run: cargo test --locked -p glowkit-core -p glowkit-stream -p glowkit
