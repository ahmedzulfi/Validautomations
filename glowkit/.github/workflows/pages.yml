name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen and binaryen
        run: |
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          sudo apt-get update && sudo apt-get install -y binaryen libxkbcommon-dev libgtk-3-dev
      - name: Build WebAssembly gallery
        run: ./scripts/build-web.sh
      - name: Generate catalog
        run: |
          cargo run --release -p glowkit-gallery -- --dump-json > demos.json
          python3 scripts/catalog.py demos.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
