[package]
name = "glowkit-cli"
description = "glowkit CLI: add components to your project as source you own, and scaffold new apps."
readme = "README.md"
documentation = "https://docs.rs/glowkit-cli"
homepage.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"
# `sources.bundle` is produced by `BUNDLE=1 scripts/gen-cli-registry.sh` before publishing, so the
# published crate carries every component's source and works offline.
include = ["src/**", "build.rs", "registry.json", "sources.bundle", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]
rust-version.workspace = true
authors.workspace = true
keywords = ["egui", "ui", "cli", "components", "scaffold"]
categories = ["command-line-utilities", "gui", "development-tools"]

[[bin]]
name = "glowkit"
path = "src/main.rs"

[dependencies]
miniz_oxide = "0.8"
serde_json = "1"

[build-dependencies]
miniz_oxide = "0.8"
