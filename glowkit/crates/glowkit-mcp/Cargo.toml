[package]
name = "glowkit-mcp"
description = "MCP server that lets AI coding agents search, read and use glowkit components."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
rmcp = { version = "3.10.0", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std"] }
