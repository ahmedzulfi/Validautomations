rust-version.workspace = true
authors.workspace = true
keywords = ["egui", "3d", "software-renderer", "mesh", "gui"]
categories = ["gui", "rendering", "graphics", "game-development"]

[features]
default = []
demos = []

[dependencies]
egui.workspace = true
glowkit-core.workspace = true
