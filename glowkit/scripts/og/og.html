<!doctype html>
<html lang="en">

     Images come from website/img/c/ (made by scripts/site-images.py). -->
<style>
  :root { --w: 1200px; --h: 630px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: var(--w); height: var(--h); overflow: hidden; background: #fff; color: #111113;
    font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; position: relative; }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(#d9d9de 1.2px, transparent 1.3px); background-size: 20px 20px;
    mask-image: radial-gradient(ellipse 60% 70% at 18% 50%, black, transparent 75%); }
  .glow { position: absolute; width: 760px; height: 760px; right: -160px; top: -120px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(139,92,246,.20), rgba(236,72,153,.10) 55%, transparent); filter: blur(10px); }
  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; z-index: 2; }
  .brand { display: flex; align-items: center; gap: 16px; font: 700 44px/1 "Inter Display", "Inter", sans-serif; letter-spacing: -.03em; }
  .brand i { width: 64px; height: 64px; border-radius: 18px; background: #111113; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(17,17,19,.18); }
  .brand svg { width: 34px; height: 34px; }
  h1 { margin: 40px 0 18px; font: 700 54px/1.04 "Inter Display", "Inter", sans-serif; letter-spacing: -.04em; }
  h1 span { color: #6b6b74; }
  .sub { font-size: 21px; line-height: 1.45; color: #55555e; margin: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 30px; }
  .tags b { font: 600 14px "Inter", sans-serif; padding: 6px 11px; border-radius: 10px; border: 1px solid #e4e4e7; background: rgba(255,255,255,.8); }
  .stage { position: absolute; left: 545px; top: -30px; width: 900px; height: 760px; perspective: 1800px; z-index: 1; }
  .grid { position: absolute; inset: 0; display: grid; grid-template-columns: 330px 330px; grid-auto-rows: 186px; gap: 20px;
    transform: rotateX(16deg) rotateY(-14deg) rotateZ(5deg) translate(20px, 30px); transform-origin: 30% 50%; }
  .grid .col2 { transform: translateY(-70px); }
  .card { border-radius: 18px; overflow: hidden; background: #f2f2f3; border: 1px solid #e4e4e7;
    box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 24px 50px -12px rgba(17,17,19,.25); }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; }
  body.wide .left { left: 80px; }
  body.wide .stage { left: 600px; }
</style>
</head>
