[package]
name = "glowkit-dioxus-gallery"
description = "Gallery of glowkit-dioxus components."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
glowkit-dioxus.workspace = true
dioxus = { workspace = true, features = ["launch", "macro", "html", "signals", "hooks"] }

[features]
default = ["web"]
web = ["dioxus/web", "dioxus/mounted"]
desktop = ["dioxus/desktop"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }
