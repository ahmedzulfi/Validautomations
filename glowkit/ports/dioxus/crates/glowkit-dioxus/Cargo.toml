[package]
name = "glowkit-dioxus"
description = "glowkit's animated design language and flagship components for Dioxus 0.7."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
glowkit-tokens.workspace = true
dioxus = { workspace = true, features = ["macro", "html", "signals", "hooks"] }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "CanvasRenderingContext2d",
  "ImageData", "Performance", "DomRect",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time"] }
